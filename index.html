<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6d28d9" />
    <title>LUCKY DRAW – Pick Your Winner!</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <style>
      :root {
        --bg: #100816;
        --raised: #1a0e26;
        --surface: #261538;
        --strong: #351d4d;
        --ink: #fff4e8;
        --muted: #cbb6d6;
        --line: #5c3e74;
        --pink: #ff3d8a;
        --gold: #ffc44d;
        --aqua: #2ad4c4;
        --violet: #8b6cff;
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); overflow-anchor: none; }
      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--ink);
        font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(139, 108, 255, 0.45), transparent 60%),
          radial-gradient(ellipse 40% 30% at 100% 20%, rgba(255, 61, 138, 0.22), transparent 55%),
          var(--bg);
      }
      button, input, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.45; }
      :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
      .wrap { width: min(1100px, calc(100% - 24px)); margin: 0 auto; padding: 20px 0 48px; }
      header { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
      h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -0.03em; }
      h1 span { color: var(--gold); }
      .sub { margin: 4px 0 0; color: var(--muted); }
      .mix { display: flex; align-items: center; gap: 8px; }
      .mix input[type="range"] { width: 110px; accent-color: var(--gold); }
      .icon {
        width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line);
        background: var(--surface); color: var(--gold);
      }
      .grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; margin-top: 18px; }
      @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
      .card { background: rgba(26, 14, 38, 0.92); border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
      .stage { position: relative; overflow: clip; }
      .lights { display: flex; gap: 6px; margin-bottom: 10px; }
      .lights i { width: 9px; height: 9px; border-radius: 99px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
      .lights i:nth-child(3n+2) { background: var(--pink); box-shadow: 0 0 8px var(--pink); }
      .lights i:nth-child(3n) { background: var(--aqua); box-shadow: 0 0 8px var(--aqua); }
      .reel {
        position: relative; height: 300px; overflow: clip; border-radius: 18px;
        background: #140a1e; border: 1px solid var(--line);
        mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
      }
      .strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
      .slot {
        height: 100px; display: flex; align-items: center; justify-content: center;
        font-size: clamp(1.3rem, 3vw, 2rem); font-weight: 800; text-align: center; padding: 0 16px;
      }
      .idle-name { font-size: clamp(1.4rem, 4vw, 2.2rem); text-align: center; margin: 28px 8px 8px; }
      .hint { text-align: center; color: var(--muted); margin: 0 12px 18px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .btn { border: 0; border-radius: 999px; padding: 12px 16px; font-weight: 800; background: var(--strong); }
      .btn.draw { background: linear-gradient(90deg, var(--pink), #ff7a3c); color: #1a0610; }
      .btn.gold { background: var(--gold); color: #2a1600; }
      .banner { min-height: 1.2em; color: var(--gold); margin: 8px 0 0; }
      .winner {
        position: absolute; inset: 0; display: none; place-items: center; text-align: center;
        background: rgba(16, 8, 22, 0.72); padding: 16px;
      }
      .winner.show { display: grid; }
      .winner strong { display: block; font-size: clamp(2rem, 7vw, 4.2rem); line-height: 1.05; color: var(--gold); }
      canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
      textarea, input[type="text"] {
        width: 100%; border-radius: 14px; border: 1px solid var(--line); background: #140a1e; padding: 10px 12px;
      }
      textarea { min-height: 140px; resize: vertical; }
      .count { color: var(--muted); }
      .count b { color: var(--ink); }
      ul { list-style: none; margin: 12px 0 0; padding: 0; max-height: 280px; overflow: auto; }
      li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(92, 62, 116, 0.55); }
      li input { flex: 1; }
      .ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
      .history li { display: block; }
    </style>
  </head>
  <body>
    <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
    <div class="wrap">
      <header>
        <div>
          <h1>LUCKY DRAW <span>– Pick Your Winner!</span></h1>
          <p class="sub">One winner. Names stay on this device.</p>
        </div>
        <div class="mix">
          <input id="volume" type="range" min="0" max="100" value="70" aria-label="Sound volume" />
          <button class="icon" id="sound" type="button" aria-pressed="true" aria-label="Turn sound off">On</button>
        </div>
      </header>
      <div class="grid">
        <section class="card stage" aria-live="polite">
          <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <h2 id="heading">The spotlight is ready</h2>
          <div class="reel" id="reel">
            <div class="strip" id="strip"></div>
          </div>
          <p class="hint" id="hint">Add names, then draw one winner.</p>
          <div class="actions">
            <button class="btn draw" id="draw" type="button">DRAW WINNER</button>
            <button class="btn" id="again" type="button" hidden>DRAW AGAIN</button>
          </div>
          <p class="banner" id="banner" role="status"></p>
          <div class="winner" id="winner">
            <div>
              <p>We have a winner</p>
              <strong id="winner-name"></strong>
              <p id="winner-draw"></p>
            </div>
          </div>
        </section>
        <section class="card">
          <h2>Participants</h2>
          <p class="count"><b id="count">0</b> names · <b id="eligible">0</b> still in · maximum 500</p>
          <textarea id="box" placeholder="One name per line"></textarea>
          <div class="actions">
            <button class="btn gold" id="add" type="button">Add names</button>
            <label class="btn">Import TXT or CSV<input id="file" type="file" accept=".txt,.csv,text/plain,text/csv" hidden /></label>
            <button class="btn" id="dedupe" type="button">Remove duplicate names</button>
            <button class="btn" id="clear" type="button">Clear all</button>
          </div>
          <ul id="list"></ul>
          <h2>Winner history</h2>
          <ul class="history" id="history"></ul>
          <div class="actions">
            <button class="btn" id="reset" type="button">Reset draw session</button>
          </div>
        </section>
      </div>
    </div>
    <script>
      const MAX = 500;
      const SPIN_MS = 15000;
      const ITEM = 100;
      const KEY = "lucky-draw-pages-v1";
      const DECEL_AT = 0.8;
      const CRUISE = (2 * DECEL_AT) / (1 + DECEL_AT);
      const $ = (id) => document.getElementById(id);
      const state = load();
      let lock = false;
      let spinKey = 0;
      let frame = 0;
      let audioCtx = null;
      let master = null;
      let clickBuffer = null;

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(KEY) || "");
          if (saved && Array.isArray(saved.participants)) return saved;
        } catch { /* fresh session */ }
        return { participants: [], winners: [], soundOn: true, volume: 0.7 };
      }
      function save() {
        localStorage.setItem(KEY, JSON.stringify(state));
      }
      function clean(raw) {
        return String(raw || "").replace(/\s+/g, " ").trim().slice(0, 160);
      }
      function uid() {
        const bytes = new Uint8Array(8);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
      }
      function secureIndex(count) {
        const limit = Math.floor(0x100000000 / count) * count;
        const buf = new Uint32Array(1);
        let value = 0;
        do {
          crypto.getRandomValues(buf);
          value = buf[0];
        } while (value >= limit);
        return value % count;
      }
      function eligible() {
        const won = new Set(state.winners.map((winner) => winner.id));
        return state.participants.filter((person) => !won.has(person.id));
      }
      function spinProgress(t) {
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        if (t <= DECEL_AT) return (t / DECEL_AT) * CRUISE;
        const u = (t - DECEL_AT) / (1 - DECEL_AT);
        const velocity = CRUISE / DECEL_AT;
        return CRUISE + velocity * (1 - DECEL_AT) * (u / 2 + Math.sin(Math.PI * u) / (2 * Math.PI));
      }
      function secondsUntil(index, endIndex, durationMs) {
        const target = index / endIndex;
        let lo = 0;
        let hi = 1;
        for (let step = 0; step < 22; step += 1) {
          const mid = (lo + hi) / 2;
          if (spinProgress(mid) < target) lo = mid;
          else hi = mid;
        }
        return ((lo + hi) / 2) * (durationMs / 1000);
      }
      function say(text) {
        $("banner").textContent = text || "";
      }
      function render() {
        const pool = eligible();
        $("count").textContent = String(state.participants.length);
        $("eligible").textContent = String(pool.length);
        $("draw").disabled = lock || pool.length === 0;
        $("list").replaceChildren(
          ...state.participants.map((person) => {
            const row = document.createElement("li");
            const field = document.createElement("input");
            field.type = "text";
            field.value = person.name;
            field.setAttribute("aria-label", "Edit " + person.name);
            field.addEventListener("change", () => {
              const next = clean(field.value);
              if (!next) field.value = person.name;
              else {
                person.name = next;
                const past = state.winners.find((winner) => winner.id === person.id);
                if (past) past.name = next;
                save();
                render();
              }
            });
            const remove = document.createElement("button");
            remove.className = "ghost";
            remove.type = "button";
            remove.textContent = "Remove";
            remove.addEventListener("click", () => {
              if (lock) return;
              state.participants = state.participants.filter((entry) => entry.id !== person.id);
              save();
              render();
            });
            row.append(field, remove);
            return row;
          }),
        );
        $("history").replaceChildren(
          ...state.winners.map((winner) => {
            const row = document.createElement("li");
            row.textContent = "Draw " + winner.drawNumber + " · " + winner.name;
            return row;
          }),
        );
        const latest = state.winners.at(-1);
        if (!lock) {
          $("heading").textContent = latest ? "We have a winner" : "The spotlight is ready";
          $("hint").textContent = pool.length
            ? pool.length + " names can still win."
            : "Add at least one name. Events usually use 50 to 500.";
          $("winner").classList.toggle("show", Boolean(latest));
          if (latest) {
            $("winner-name").textContent = latest.name;
            $("winner-draw").textContent = "Draw " + latest.drawNumber;
          }
          $("strip").style.transform = "translate3d(0, 100px, 0)";
          $("strip").replaceChildren();
        }
        $("volume").value = String(Math.round((state.volume ?? 0.7) * 100));
        $("sound").textContent = state.soundOn ? "On" : "Off";
        $("sound").setAttribute("aria-pressed", state.soundOn ? "true" : "false");
        $("sound").setAttribute("aria-label", state.soundOn ? "Turn sound off" : "Turn sound on");
      }
      function addNames(names) {
        const room = MAX - state.participants.length;
        const accepted = names.filter(Boolean).slice(0, Math.max(0, room));
        accepted.forEach((name) => state.participants.push({ id: uid(), name }));
        save();
        render();
        const skipped = names.filter(Boolean).length - accepted.length;
        if (!accepted.length && skipped) say("The draw is full at 500 names.");
        else if (skipped) say("Added " + accepted.length + ". " + skipped + " did not fit. 500 is the maximum.");
        else if (accepted.length) say("Added " + accepted.length + ".");
        else say("No names found.");
      }
      function parseCsvLine(line) {
        const cells = [];
        let current = "";
        let quoted = false;
        for (let i = 0; i < line.length; i += 1) {
          const char = line[i];
          if (quoted) {
            if (char === '"') {
              if (line[i + 1] === '"') { current += '"'; i += 1; }
              else quoted = false;
            } else current += char;
          } else if (char === '"') quoted = true;
          else if (char === ",") { cells.push(current); current = ""; }
          else current += char;
        }
        cells.push(current);
        return cells;
      }
      function namesFromText(text, filename) {
        const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter((line) => line.trim());
        if (!filename.toLowerCase().endsWith(".csv")) return lines.map(clean).filter(Boolean);
        const rows = lines.map(parseCsvLine);
        const header = clean(rows[0]?.[0] || "").toLowerCase();
        const start = ["name", "names", "participant", "participants", "entrant", "entrants", "full name", "fullname"].includes(header) ? 1 : 0;
        return rows.slice(start).map((row) => clean(row[0] || "")).filter(Boolean);
      }
      function context() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        if (!master) {
          master = audioCtx.createGain();
          master.connect(audioCtx.destination);
        }
        master.gain.value = state.soundOn ? (state.volume ?? 0.7) * 0.5 : 0;
        return audioCtx;
      }
      function wheelClick(ctx) {
        if (clickBuffer && clickBuffer.sampleRate === ctx.sampleRate) return clickBuffer;
        const length = Math.floor(ctx.sampleRate * 0.022);
        const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let noise = 0;
        for (let i = 0; i < length; i += 1) {
          const time = i / ctx.sampleRate;
          noise = noise * 0.55 + (Math.random() * 2 - 1) * 0.45;
          const env = Math.exp(-time * 220);
          data[i] = (Math.sin(2 * Math.PI * 210 * time) * 0.65 + noise * 0.18) * env * 0.2;
        }
        clickBuffer = buffer;
        return buffer;
      }
      function startTicks(endIndex, durationMs) {
        const ctx = context();
        if (!ctx || !state.soundOn) return;
        const bus = master;
        const now = ctx.currentTime + 0.02;
        const click = wheelClick(ctx);
        const duration = durationMs / 1000;
        for (let step = 1; step < endIndex; step += 1) {
          const at = secondsUntil(step, endIndex, durationMs);
          if (at > duration - 0.08) continue;
          const source = ctx.createBufferSource();
          source.buffer = click;
          source.connect(bus);
          source.start(now + at);
        }
      }
      function chime() {
        const ctx = context();
        if (!ctx || !state.soundOn || !(state.volume > 0)) return;
        const now = ctx.currentTime + 0.03;
        [523.25, 659.25, 783.99].forEach((frequency, index) => {
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          const start = now + index * 0.11;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(0.04, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.55);
          oscillator.connect(gain);
          gain.connect(master);
          oscillator.start(start);
          oscillator.stop(start + 0.58);
        });
      }
      function sequenceFor(pool, winner) {
        const length = Math.min(72, Math.max(24, pool.length));
        const sequence = [];
        for (let i = 0; i < length - 1; i += 1) {
          let pick = pool[secureIndex(pool.length)];
          if (sequence.length && pick.id === sequence[sequence.length - 1].id && pool.length > 1) {
            pick = pool[(pool.indexOf(pick) + 1) % pool.length];
          }
          sequence.push(pick);
        }
        sequence.push(winner);
        return sequence;
      }
      function celebrate() {
        const canvas = $("confetti");
        const ctx = canvas.getContext("2d");
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        const colors = ["#ffc44d", "#ff3d8a", "#2ad4c4", "#8b6cff", "#fff4e8"];
        const bits = Array.from({ length: 90 }, () => ({
          x: Math.random() * canvas.width,
          y: -Math.random() * canvas.height * 0.4,
          v: 1.5 * dpr + Math.random() * 3 * dpr,
          s: (4 + Math.random() * 6) * dpr,
          c: colors[Math.floor(Math.random() * colors.length)],
          r: Math.random() * Math.PI,
        }));
        const started = performance.now();
        const tick = (now) => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          bits.forEach((bit) => {
            bit.y += bit.v;
            bit.r += 0.05;
            ctx.save();
            ctx.translate(bit.x, bit.y);
            ctx.rotate(bit.r);
            ctx.fillStyle = bit.c;
            ctx.fillRect(-bit.s / 2, -bit.s / 4, bit.s, bit.s / 2);
            ctx.restore();
          });
          if (now - started < 4200) requestAnimationFrame(tick);
          else ctx.clearRect(0, 0, canvas.width, canvas.height);
        };
        requestAnimationFrame(tick);
      }
      function finish(key, winner) {
        if (key !== spinKey) return;
        cancelAnimationFrame(frame);
        lock = false;
        state.winners.push({
          id: winner.id,
          name: winner.name,
          drawNumber: state.winners.length + 1,
          at: Date.now(),
        });
        save();
        $("again").hidden = eligible().length === 0;
        render();
        chime();
        celebrate();
      }
      function draw() {
        const pool = eligible();
        if (lock || !pool.length) {
          if (!pool.length) say("Add names before starting a draw.");
          return;
        }
        lock = true;
        spinKey += 1;
        const key = spinKey;
        const winner = pool[secureIndex(pool.length)];
        const sequence = sequenceFor(pool, winner);
        const endIndex = sequence.length - 1;
        const strip = $("strip");
        strip.replaceChildren(
          ...sequence.map((person) => {
            const slot = document.createElement("div");
            slot.className = "slot";
            slot.textContent = person.name;
            return slot;
          }),
        );
        $("heading").textContent = "Drawing now";
        $("hint").textContent = "The wheel is slowing toward one name.";
        $("winner").classList.remove("show");
        $("draw").disabled = true;
        $("again").hidden = true;
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const duration = reduced ? 700 : SPIN_MS;
        const startY = (300 - ITEM) / 2;
        const endY = startY - endIndex * ITEM;
        const started = performance.now();
        context();
        startTicks(endIndex, duration);
        const step = (now) => {
          if (key !== spinKey) return;
          const t = Math.min(1, (now - started) / duration);
          const y = startY + (endY - startY) * (reduced ? t : spinProgress(t));
          strip.style.transform = "translate3d(0," + y.toFixed(2) + "px,0)";
          if (t < 1) frame = requestAnimationFrame(step);
          else finish(key, winner);
        };
        frame = requestAnimationFrame(step);
      }
      $("add").addEventListener("click", () => {
        if (lock) return;
        addNames($("box").value.split(/\r?\n/).map(clean));
        $("box").value = "";
      });
      $("file").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        event.target.value = "";
        if (!file || lock) return;
        addNames(namesFromText(await file.text(), file.name));
      });
      $("dedupe").addEventListener("click", () => {
        if (lock) return;
        const seen = new Set();
        const kept = [];
        state.participants.forEach((person) => {
          const key = person.name.toLowerCase();
          if (seen.has(key)) return;
          seen.add(key);
          kept.push(person);
        });
        const removed = state.participants.length - kept.length;
        state.participants = kept;
        save();
        render();
        say(removed ? "Removed " + removed + " duplicate names." : "No duplicate names.");
      });
      $("clear").addEventListener("click", () => {
        if (lock) return;
        if ($("clear").dataset.armed !== "1") {
          $("clear").dataset.armed = "1";
          $("clear").textContent = "Confirm clear all";
          setTimeout(() => {
            $("clear").dataset.armed = "";
            $("clear").textContent = "Clear all";
          }, 2800);
          return;
        }
        state.participants = [];
        save();
        render();
        say("Participant list cleared. Winner history is still here.");
      });
      $("reset").addEventListener("click", () => {
        if (lock) return;
        if ($("reset").dataset.armed !== "1") {
          $("reset").dataset.armed = "1";
          $("reset").textContent = "Confirm reset";
          setTimeout(() => {
            $("reset").dataset.armed = "";
            $("reset").textContent = "Reset draw session";
          }, 2800);
          return;
        }
        state.winners = [];
        save();
        $("winner").classList.remove("show");
        $("again").hidden = true;
        render();
        say("Draw session reset. Previous winners can be drawn again.");
      });
      $("draw").addEventListener("click", draw);
      $("again").addEventListener("click", draw);
      $("sound").addEventListener("click", () => {
        state.soundOn = !state.soundOn;
        save();
        if (master && audioCtx) master.gain.value = state.soundOn ? (state.volume ?? 0.7) * 0.5 : 0;
        render();
      });
      $("volume").addEventListener("input", () => {
        state.volume = Number($("volume").value) / 100;
        save();
        if (state.volume > 0 && !state.soundOn) state.soundOn = true;
        if (master) master.gain.value = state.soundOn ? state.volume * 0.5 : 0;
        render();
      });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
        });
      }
      render();
    </script>
  </body>
</html>
